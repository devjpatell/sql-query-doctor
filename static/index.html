<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL Query Doctor</title>
<style>
:root{
  --bg:#f4f6f5; --panel:#fff; --fg:#17201d; --muted:#5d6b66; --line:#d9e0dd;
  --accent:#0d6b5e; --accent-fg:#fff; --code:#eef3f1; --good:#1f7a3a; --bad:#a2312a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101614; --panel:#18201d; --fg:#e3ebe7; --muted:#97a6a0; --line:#2a3531;
  --accent:#5cc7b5; --accent-fg:#0d1513; --code:#0f1715; --good:#7fd497; --bad:#f0948c; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans)}
.wrap{max-width:1100px;margin:0 auto;padding:28px 16px 60px;display:grid;gap:22px}
h1{margin:0;font-size:28px}
.sub{color:var(--muted);margin:4px 0 0;max-width:70ch}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
label{display:block;font-weight:600;margin-bottom:6px}
textarea{width:100%;min-height:240px;font:13px/1.45 var(--mono);padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);resize:vertical}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button{font:inherit;font-weight:600;padding:9px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font:inherit;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px}
.stats{display:flex;flex-wrap:wrap;gap:28px}
.stat b{display:block;font:700 26px/1.1 var(--sans);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.stat.win b{color:var(--good)}
pre{margin:0;background:var(--code);padding:12px;border-radius:8px;overflow-x:auto;font:13px/1.5 var(--mono)}
.scan{color:var(--bad);font-weight:600}
.why{color:var(--muted);font-size:13px;margin:4px 0 10px}
.err{color:var(--bad);font-weight:600}
h2{margin:0;font-size:17px}
.muted{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SQL Query Doctor</h1>
    <p class="sub">Paste a schema and a slow SELECT. The doctor fills a test database with realistic rows, reads the query plan, suggests indexes, and keeps only the ones that make the query measurably faster.</p>
  </header>

  <div class="grid">
    <div><label for="schema">Schema (CREATE TABLE statements)</label><textarea id="schema" spellcheck="false"></textarea></div>
    <div><label for="query">Query to analyze</label><textarea id="query" spellcheck="false"></textarea></div>
  </div>

  <div class="bar">
    <button id="run">Analyze query</button>
    <button id="example" class="ghost">Load example</button>
    <label for="rows" style="margin:0;font-weight:500">Test rows per large table</label>
    <select id="rows"><option>10000</option><option selected>100000</option><option>300000</option></select>
    <span id="status" class="muted" role="status"></span>
  </div>

  <section id="out" class="panel" hidden></section>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function loadExample(){
  const r = await fetch("/api/example"); const d = await r.json();
  $("schema").value = d.schema; $("query").value = d.query;
}

function plan(lines, scans){
  return lines.map(l => /^SCAN \w+(\s+AS \w+)?\s*$/.test(l.trim()) ? `<span class="scan">${esc(l)}</span>` : esc(l)).join("\n");
}

async function run(){
  const btn = $("run"); btn.disabled = true; $("status").textContent = "Building test data and timing the query…";
  try{
    const r = await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({schema:$("schema").value, query:$("query").value, rows:+$("rows").value})});
    const d = await r.json(); const out = $("out"); out.hidden = false;
    if(!r.ok){ out.innerHTML = `<p class="err">${esc(d.error)}</p>`; return; }
    const sugg = d.suggestions.length
      ? d.suggestions.map(s => `<pre>${esc(s.sql)}</pre><p class="why">${esc(s.reason)}</p>`).join("")
      : `<p class="muted">No new indexes needed.</p>`;
    out.innerHTML = `
      <div class="stats">
        <div class="stat"><b>${d.before_ms.toFixed(3)} ms</b><span>before</span></div>
        <div class="stat"><b>${d.after_ms.toFixed(3)} ms</b><span>after</span></div>
        <div class="stat win"><b>${d.speedup}×</b><span>faster</span></div>
        <div class="stat"><b>${d.result_rows.toLocaleString()}</b><span>rows returned (same before and after)</span></div>
      </div>
      <h2>Suggested indexes</h2>${sugg}
      ${d.notes.map(n => `<p class="why">${esc(n)}</p>`).join("")}
      <div class="grid">
        <div><h2>Plan before</h2><pre>${plan(d.plan_before)}</pre></div>
        <div><h2>Plan after</h2><pre>${plan(d.plan_after)}</pre></div>
      </div>
      <p class="muted">Test data: ${Object.entries(d.rows_per_table).map(([t,n]) => `${esc(t)} ${n.toLocaleString()}`).join(" · ")}</p>`;
  }catch(e){ $("out").hidden = false; $("out").innerHTML = `<p class="err">Could not reach the server: ${esc(e.message)}</p>`; }
  finally{ btn.disabled = false; $("status").textContent = ""; }
}

$("run").addEventListener("click", run);
$("example").addEventListener("click", loadExample);
loadExample();
</script>
</body>
</html>
